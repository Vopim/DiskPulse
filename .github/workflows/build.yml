name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DiskPulse
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\Build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskPulse-win64
          path: |
            DiskPulse.exe
            DiskPulse-win64.zip
          if-no-files-found: error
